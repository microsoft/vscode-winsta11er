name: Release Binaries

on:
  push:
    tags: "v*"

jobs:
  release:
    name: Release
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.17.0-rc2
        stable: 'false'

    - name: Build x64
      run: |
        $env:GOARCH="amd64"
        go build -v -o "vscode-winsta11er-x64.exe" -ldflags -H=windowsgui
    - name: Build ia32
      run: |
        $env:GOARCH="386"
        go build -v -o "vscode-winsta11er-ia32.exe" -ldflags -H=windowsgui
    - name: Build arm64
      run: |
        $env:GOARCH="arm64"
        go build -v -o "vscode-winsta11er-arm64.exe" -ldflags -H=windowsgui
    - uses: "marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1" # latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        files: |
          *.exe
